    this.state.reports ||= [];
    this.state.feedback ||= [];
    this.state.readState ||= {};
    this.state.schemaVersion = 2;
  }

  getState() { return structuredClone(this.state); }
  getActiveUser() { return structuredClone(this.mustUser(this.state.activeUserId)); }
  getExchange(id) { return structuredClone(this.mustExchange(id)); }
  getBalances(userId = this.state.activeUserId) { return getAccountBalances(this.state.ledger, userId); }

  switchUser(userId) {
    this.mustUser(userId);
    return this.commit((draft) => { draft.activeUserId = userId; return draft.users.find((user) => user.id === userId); });
  }

  createProfile(input) {
    validateRequired(input.name, 'nombre');
    validateNeighborhood(input.neighborhood);
    return this.commit((draft) => {
      const id = nextId(draft, 'user', 'u');
      const user = {
        id,
        name: input.name.trim(),
        neighborhood: input.neighborhood,
        intent: input.intent || 'BOTH',
        skills: [...(input.skills || [])].slice(0, 3),
        needs: [...(input.needs || [])].slice(0, 3),
        avatar: initials(input.name),
        verification: 'V1_DEMO',
        bio: input.bio?.trim() || 'Perfil creado en modo demo local.',
        createdAt: new Date().toISOString(),
      };
      draft.users.push(user);
      draft.activeUserId = id;
      grantWelcomeCredit(draft.ledger, id, `welcome:${id}`);
      return user;
    });
  }

  createOffer(input) {
    validateMarketInput(input);
    assertUserEligibility(this.getActiveUser(), input.category, input.modality);
    return this.commit((draft) => {
      const offer = {
        id: nextId(draft, 'offer', 'o'), providerId: draft.activeUserId,
        title: input.title.trim(), category: input.category, skill: input.skill || input.category,
        description: (input.description || '').trim(), modality: input.modality,
        neighborhood: input.neighborhood || this.mustUser(draft.activeUserId).neighborhood,
        durationCt: positiveInteger(input.durationCt, 'durationCt'), availability: input.availability || 'A coordinar', active: true,
      };
      draft.offers.unshift(offer);
      return offer;
    });
  }

  createRequest(input) {
    validateMarketInput(input);
    assertUserEligibility(this.getActiveUser(), input.category, input.modality);
    return this.commit((draft) => {
      const request = {
        id: nextId(draft, 'request', 'r'), requesterId: draft.activeUserId,
        title: input.title.trim(), category: input.category, modality: input.modality,
        neighborhood: input.neighborhood || this.mustUser(draft.activeUserId).neighborhood,
        durationCt: positiveInteger(input.durationCt, 'durationCt'), notes: (input.notes || '').trim(), status: 'OPEN',
      };
      draft.requests.unshift(request);
      return request;
    });
  }

  proposeExchange(input) {
    const durationCt = positiveInteger(input.durationCt, 'durationCt');
    const request = this.mustRequest(input.requestId);
    const offer = this.mustOffer(input.offerId);
    if (request.requesterId !== this.state.activeUserId) throw new Error('Solo el solicitante puede proponer.');
    if (offer.providerId !== input.providerId) throw new Error('Prestador inválido.');
    if (offer.providerId === request.requesterId) throw new Error('No podés intercambiar con vos mismo.');
    const modality = input.modality || request.modality;
    assertUserEligibility(this.mustUser(request.requesterId), request.category, modality);
    assertUserEligibility(this.mustUser(offer.providerId), offer.category, modality);
    if (isBlocked(this.state, request.requesterId, offer.providerId)) throw new Error('Hay un bloqueo entre estos perfiles.');
    if (!offer.active || offer.category !== request.category || offer.modality !== modality || request.modality !== modality) throw new Error('La oferta no es compatible con esta solicitud.');
    if (request.status !== 'OPEN') throw new Error('La solicitud ya no está abierta.');
    if (input.scheduledAt && !Number.isFinite(Date.parse(input.scheduledAt))) throw new Error('Horario inválido.');
    return this.commit((draft) => {
      const exchange = {
        id: nextId(draft, 'exchange', 'x'), requestId: request.id, offerId: offer.id,
        requesterId: request.requesterId, providerId: offer.providerId,
        category: request.category, modality: input.modality || request.modality,
        neighborhood: request.neighborhood, durationCt, quarters: ctToQuarters(durationCt),
        scheduledAt: input.scheduledAt || '', note: (input.note || '').trim(), status: 'REQUESTED',
        createdAt: new Date().toISOString(), timeline: [{ status: 'REQUESTED', at: new Date().toISOString() }],
      };
      draft.exchanges.unshift(exchange);
      draft.conversations.push({ exchangeId: exchange.id, messages: [] });
      return exchange;
    });
  }

  declineExchange(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.providerId) throw new Error('Solo el prestador puede rechazar.');
    assertTransition(exchange.status, 'DECLINED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      setStatus(current, 'DECLINED');
      current.outcome = 'DECLINED_BY_PROVIDER';
      return current;
    });
  }

  acceptExchange(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.providerId) throw new Error('Solo el prestador puede aceptar.');
    assertUserEligibility(this.mustUser(exchange.requesterId), exchange.category, exchange.modality);
    assertUserEligibility(this.mustUser(exchange.providerId), exchange.category, exchange.modality);
    if (isBlocked(this.state, exchange.requesterId, exchange.providerId)) throw new Error('Hay un bloqueo entre estos perfiles.');
    if (this.mustRequest(exchange.requestId).status !== 'OPEN') throw new Error('La solicitud ya tiene un intercambio reservado.');
    if (!this.mustOffer(exchange.offerId).active) throw new Error('La oferta ya no está activa.');
    assertTransition(exchange.status, 'ESCROWED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      holdCredits(draft.ledger, { userId: current.requesterId, exchangeId, quarters: current.quarters, idempotencyKey: `hold:${exchangeId}` });
      setStatus(current, 'ESCROWED');
      draft.requests.find(r => r.id === current.requestId).status = 'RESERVED';
      return current;
    });
  }

  startExchange(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (![exchange.providerId, exchange.requesterId].includes(this.state.activeUserId)) throw new Error('No participás de este intercambio.');
    assertTransition(exchange.status, 'IN_PROGRESS');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      setStatus(current, 'IN_PROGRESS');
      current.startedAt = new Date().toISOString();
      return current;
    });
  }

  completeByProvider(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.providerId) throw new Error('Solo el prestador puede marcar completado.');
    assertTransition(exchange.status, 'COMPLETED_BY_PROVIDER');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      setStatus(current, 'COMPLETED_BY_PROVIDER');
      current.completedByProviderAt = new Date().toISOString();
      return current;
    });
  }

  confirmExchange(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.requesterId) throw new Error('Solo el solicitante puede confirmar.');
    assertTransition(exchange.status, 'CONFIRMED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      releaseEscrow(draft.ledger, {
        requesterId: current.requesterId, providerId: current.providerId, exchangeId,
        quarters: current.quarters, idempotencyKey: `release:${exchangeId}`,
      });
      setStatus(current, 'CONFIRMED');
      current.confirmedAt = new Date().toISOString();
      const request = draft.requests.find((item) => item.id === current.requestId);
      if (request) request.status = 'FULFILLED';
      return current;
    });
  }

  findMatches(requestId) {
    return structuredClone(findMatchesForRequest(this.state, requestId));
  }

  getUserReputation(userId) {
    this.mustUser(userId);
    return structuredClone(buildUserReputation(this.state, userId));
  }

  proposeExtension(exchangeId, additionalCt) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.providerId) throw new Error('Solo el prestador puede proponer una extensión.');
    if (!['ESCROWED', 'IN_PROGRESS'].includes(exchange.status)) throw new Error('La extensión solo está disponible durante un intercambio reservado o en curso.');
    const amount = positiveInteger(additionalCt, 'additionalCt');
    if (exchange.durationCt + amount > 32) throw new Error('El acuerdo no puede superar 32 CT en esta demo.');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      current.pendingExtensionCt = amount;
      current.extensionStatus = 'PROPOSED';
      return current;
    });
  }

  acceptExtension(exchangeId) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.requesterId) throw new Error('Solo el solicitante puede aprobar una extensión.');
    if (!['ESCROWED','IN_PROGRESS'].includes(exchange.status)) throw new Error('La extensión no está disponible en este estado.');
    if (!exchange.pendingExtensionCt || exchange.extensionStatus !== 'PROPOSED') throw new Error('No existe una extensión pendiente.');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      const extraQuarters = ctToQuarters(current.pendingExtensionCt);
      holdCredits(draft.ledger, {
        userId: current.requesterId, exchangeId, quarters: extraQuarters,
        idempotencyKey: `extension:${exchangeId}:${current.durationCt}:${current.pendingExtensionCt}`,
      });
      current.durationCt += current.pendingExtensionCt;
      current.quarters += extraQuarters;
      current.extensionStatus = 'ACCEPTED';
      current.pendingExtensionCt = null;
      return current;
    });
  }

  cancelExchange(exchangeId, { hoursUntilStart } = {}) {
    const exchange = this.mustExchange(exchangeId);
    hoursUntilStart ??= exchange.scheduledAt ? (Date.parse(exchange.scheduledAt) - Date.now()) / 3600000 : 3;
    const isRequester = this.state.activeUserId === exchange.requesterId;
    const isProvider = this.state.activeUserId === exchange.providerId;
    if (!isRequester && !isProvider) throw new Error('No participás de este intercambio.');
    if (exchange.status === 'REQUESTED') {
      assertTransition(exchange.status, 'CANCELLED');
      return this.commit((draft) => {
        const current = draft.exchanges.find((item) => item.id === exchangeId);
        current.outcome = isRequester ? 'REQUESTER_CANCELLED' : 'PROVIDER_CANCELLED';
        setStatus(current, 'CANCELLED');
        return current;
      });
    }
    if (!['ESCROWED', 'IN_PROGRESS'].includes(exchange.status)) throw new Error('El intercambio no puede cancelarse en este estado.');
    assertTransition(exchange.status, 'CANCELLED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      if (isProvider) {
        refundEscrow(draft.ledger, { userId: current.requesterId, exchangeId, quarters: current.quarters, idempotencyKey: `provider-cancel:${exchangeId}` });
        current.outcome = 'PROVIDER_CANCELLED';
      } else if (hoursUntilStart >= 2) {
        refundEscrow(draft.ledger, { userId: current.requesterId, exchangeId, quarters: current.quarters, idempotencyKey: `requester-cancel-full:${exchangeId}` });
        current.outcome = 'REQUESTER_CANCELLED';
      } else {
        const providerQuarters = current.quarters / 4;
        splitEscrow(draft.ledger, {
          requesterId: current.requesterId, providerId: current.providerId, exchangeId,
          providerQuarters, requesterQuarters: current.quarters - providerQuarters,
          idempotencyKey: `requester-cancel-late:${exchangeId}`, type: 'CANCELLATION_PENALTY',
        });
        current.outcome = 'REQUESTER_LATE_CANCELLED';
      }
      setStatus(current, 'CANCELLED');
      current.pendingExtensionCt = null;
      const request = draft.requests.find(r => r.id === current.requestId);
      if (request?.status === 'RESERVED') request.status = 'OPEN';
      return current;
    });
  }

  recordNoShow(exchangeId, role) {
    const exchange = this.mustExchange(exchangeId);
    if (this.state.activeUserId !== exchange.providerId && this.state.activeUserId !== exchange.requesterId) throw new Error('No participás de este intercambio.');
    if (!['ESCROWED', 'IN_PROGRESS'].includes(exchange.status)) throw new Error('No-show inválido en este estado.');
    assertTransition(exchange.status, 'CANCELLED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      if (role === 'REQUESTER') {
        const providerQuarters = current.quarters / 2;
        splitEscrow(draft.ledger, {
          requesterId: current.requesterId, providerId: current.providerId, exchangeId,
          providerQuarters, requesterQuarters: current.quarters - providerQuarters,
          idempotencyKey: `requester-noshow:${exchangeId}`, type: 'NO_SHOW_PENALTY',
        });
        current.outcome = 'REQUESTER_NO_SHOW';
      } else if (role === 'PROVIDER') {
        refundEscrow(draft.ledger, { userId: current.requesterId, exchangeId, quarters: current.quarters, idempotencyKey: `provider-noshow:${exchangeId}` });
        current.outcome = 'PROVIDER_NO_SHOW';
      } else {
        throw new Error('Rol de no-show inválido.');
      }
      setStatus(current, 'CANCELLED');
      current.pendingExtensionCt = null;
      const request = draft.requests.find(r => r.id === current.requestId);
      if (request?.status === 'RESERVED') request.status = 'OPEN';
      return current;
    });
  }

  openDispute(exchangeId, reason = '') {
    const exchange = this.mustExchange(exchangeId);
    if (![exchange.requesterId, exchange.providerId].includes(this.state.activeUserId)) throw new Error('No participás de este intercambio.');
    if (!['ESCROWED', 'IN_PROGRESS', 'COMPLETED_BY_PROVIDER'].includes(exchange.status)) throw new Error('No se puede abrir disputa en este estado.');
    assertTransition(exchange.status, 'DISPUTED');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      current.disputeReason = String(reason).trim();
      current.disputeOpenedBy = draft.activeUserId;
      setStatus(current, 'DISPUTED');
      return current;
    });
  }

  sendMessage(exchangeId, text) {
    const exchange = this.mustExchange(exchangeId);
    const authorId = this.state.activeUserId;
    if (Date.now() - Date.parse(exchange.confirmedAt || exchange.autoReleasedAt || new Date().toISOString()) > 7*86400000) throw new Error('La ventana para valorar terminó a los 7 días.');
    if (![exchange.requesterId, exchange.providerId].includes(authorId)) throw new Error('No participás de este intercambio.');
    if (isBlocked(this.state, exchange.requesterId, exchange.providerId)) throw new Error('El chat está bloqueado entre estos perfiles. Podés usar la disputa.');
    const body = String(text || '').trim();
    if (!body) throw new Error('Escribí un mensaje.');
    if (body.length > 600) throw new Error('El mensaje es demasiado largo.');
    return this.commit((draft) => {
      const conversation = draft.conversations.find((item) => item.exchangeId === exchangeId);
      if (!conversation) throw new Error('Conversación inexistente.');
      const message = {
        id: nextId(draft, 'message', 'm'), exchangeId, authorId, body,
        createdAt: new Date().toISOString(),
      };
      conversation.messages.push(message);
      return message;
    });
  }

  submitReview(exchangeId, input) {
    const exchange = this.mustExchange(exchangeId);
    if (!['CONFIRMED', 'AUTO_RELEASED'].includes(exchange.status)) throw new Error('El intercambio debe estar confirmado antes de valorar.');
    const authorId = this.state.activeUserId;
    if (Date.now() - Date.parse(exchange.confirmedAt || exchange.autoReleasedAt || new Date().toISOString()) > 7*86400000) throw new Error('La ventana para valorar terminó a los 7 días.');
    if (![exchange.requesterId, exchange.providerId].includes(authorId)) throw new Error('No participás de este intercambio.');
    if (this.state.reviews.some((review) => review.exchangeId === exchangeId && review.authorId === authorId)) throw new Error('Ya enviaste tu valoración.');
    return this.commit((draft) => {
      const current = draft.exchanges.find((item) => item.id === exchangeId);
      const subjectId = authorId === current.requesterId ? current.providerId : current.requesterId;
      const review = {
        id: nextId(draft, 'review', 'rv'), exchangeId, authorId, subjectId,
        quality: optionalRating(input.quality), communication: rating(input.communication),
        punctuality: rating(input.punctuality), clarity: optionalRating(input.clarity),
        wouldRepeat: input.wouldRepeat === true, comment: String(input.comment || '').trim().slice(0, 500),
        createdAt: new Date().toISOString(),
      };
      draft.reviews.push(review);
      return review;
    });
  }

  getFunding(userId = this.state.activeUserId) { return getFundingSummary(this.state.ledger,userId); }

  requestOffer(offerId, input) {
    const offer = this.mustOffer(offerId);
    const durationCt = positiveInteger(input.durationCt || offer.durationCt, 'durationCt');
    if (!input.scheduledAt || !Number.isFinite(Date.parse(input.scheduledAt)) || Date.parse(input.scheduledAt) <= Date.now()) throw new Error('Elegí un horario futuro para el acuerdo.');
    if (this.getBalances().available < durationCt*4) throw new Error('No tenés saldo suficiente. Ofrecé una habilidad para ganar CT.');
    // Stage both operations against an isolated snapshot; persist exactly once.
    const staged = new DemoService({ load: () => this.getState(), save() {} });
    const request = staged.createRequest({title:offer.title,category:offer.category,modality:offer.modality,neighborhood:this.getActiveUser().neighborhood,durationCt,notes:String(input.note||'').slice(0,2000)});
    const exchange = staged.proposeExchange({requestId:request.id,offerId,providerId:offer.providerId,durationCt,modality:offer.modality,scheduledAt:new Date(input.scheduledAt).toISOString(),note:String(input.note||'').slice(0,2000)});
    return this.commit(draft => { Object.assign(draft,staged.getState()); return exchange; });
  }

  toggleFavorite(offerId) {
    this.mustOffer(offerId);
    return this.commit(draft => {
      const list=draft.favorites[draft.activeUserId] ||= [];
      const index=list.indexOf(offerId); if(index>=0) list.splice(index,1); else list.push(offerId);
      return index<0;
    });
  }
  toggleBlock(subjectId) {
    this.mustUser(subjectId); if(subjectId===this.state.activeUserId) throw new Error('No podés bloquearte.');
    return this.commit(draft => {
      const index=draft.blocks.findIndex(b=>b.userId===draft.activeUserId&&b.subjectId===subjectId);
      if(index>=0) draft.blocks.splice(index,1); else draft.blocks.push({userId:draft.activeUserId,subjectId,createdAt:new Date().toISOString()});
      return index<0;
    });
  }
  updateProfile(input) {
    validateRequired(input.name,'Nombre'); validateNeighborhood(input.neighborhood);
    if(String(input.name).trim().length>80) throw new Error('El nombre debe tener hasta 80 caracteres.');
    return this.commit(draft => {
      const user=draft.users.find(u=>u.id===draft.activeUserId);
      Object.assign(user,{name:input.name.trim(),neighborhood:input.neighborhood,bio:String(input.bio||'').trim().slice(0,600),avatar:initials(input.name)});
      for(const key of ['skills','needs']) if(Array.isArray(input[key])) user[key]=input[key].map(v=>String(v).slice(0,80)).filter(Boolean).slice(0,3);
      return user;
    });
  }
  toggleOffer(offerId) {
    const offer=this.mustOffer(offerId);if(offer.providerId!==this.state.activeUserId) throw new Error('Esta oferta no es tuya.');
    return this.commit(draft=>{const o=draft.offers.find(v=>v.id===offerId);o.active=!o.active;return o;});
  }
  rejectExtension(exchangeId) {
    const x=this.mustExchange(exchangeId);
    if(this.state.activeUserId!==x.requesterId || !['ESCROWED','IN_PROGRESS'].includes(x.status) || !x.pendingExtensionCt) throw new Error('No hay extensión para rechazar.');
    return this.commit(draft=>{const e=draft.exchanges.find(v=>v.id===exchangeId);e.pendingExtensionCt=null;e.extensionStatus='DECLINED';return e;});
  }
  createReport(input) {
    this.mustUser(input.subjectId);
    const details=String(input.details||'').trim();
    if(details.length<10 || details.length>1000) throw new Error('Describí lo ocurrido en 10 a 1000 caracteres.');
    if(!['Spam','Conducta inapropiada','Identidad dudosa','Servicio no permitido','Problema con el intercambio','Otro'].includes(input.type)) throw new Error('Tipo de reporte inválido.');
    return this.commit(draft=>{
      const report={id:`rep_${draft.reports.length+1}`,userId:draft.activeUserId,subjectId:input.subjectId,type:input.type,details,status:'OPEN',createdAt:new Date().toISOString()};
      draft.reports.push(report);return report;
    });
  }
  resolveDisputeDemo(exchangeId, providerCt, reason) {
    const x=this.mustExchange(exchangeId);
    const quarters=Number(providerCt)*4;
    if(x.status!=='DISPUTED' || !Number.isSafeInteger(quarters)||quarters<0||quarters>x.quarters) throw new Error('Reparto inválido para la disputa.');
    if(String(reason||'').trim().length<10) throw new Error('Documentá la decisión de demostración.');
    return this.commit(draft=>{
      const current=draft.exchanges.find(e=>e.id===exchangeId);
      splitEscrow(draft.ledger,{requesterId:x.requesterId,providerId:x.providerId,exchangeId,providerQuarters:quarters,requesterQuarters:x.quarters-quarters,idempotencyKey:`dispute:${exchangeId}`,type:'DISPUTE_ADJUSTMENT'});
      current.outcome='DISPUTE_RESOLVED';current.resolution={providerQuarters:quarters,reason:String(reason).slice(0,1000),operator:'DEMO_OPERATOR',at:new Date().toISOString()};
      setStatus(current,'CLOSED');return current;
    });
  }
  markRead(exchangeId) {
    const x=this.mustExchange(exchangeId);if(![x.providerId,x.requesterId].includes(this.state.activeUserId)) throw new Error('No participás de este chat.');
    return this.commit(draft=>{ draft.readState[`${draft.activeUserId}:${exchangeId}`]=new Date().toISOString();return true; });
  }
  processDue(now=Date.now()) {
    return this.commit(draft=>{
      let count=expirePromotions(draft.ledger,now);
      for(const x of draft.exchanges) {
        if(x.status!=='COMPLETED_BY_PROVIDER'||now-Date.parse(x.completedByProviderAt)<48*3600000) continue;
        releaseEscrow(draft.ledger,{requesterId:x.requesterId,providerId:x.providerId,exchangeId:x.id,quarters:x.quarters,idempotencyKey:`release:${x.id}`});
        setStatus(x,'AUTO_RELEASED');x.autoReleasedAt=new Date(now).toISOString();
        draft.requests.find(r=>r.id===x.requestId).status='FULFILLED';count++;
      }
      return count;
    });
  }
  exportData() { return JSON.stringify({format:'intera-demo-backup',version:2,exportedAt:new Date().toISOString(),state:this.getState()},null,2); }
  importData(text) {
    const imported=parseBackup(text);
    imported.favorites ||= {};imported.blocks ||= [];imported.reports ||= [];imported.readState ||= {};imported.feedback ||= [];
    imported.schemaVersion=2;
    this.repository.reset(imported);this.state=imported;return this.getState();
  }

  reset(nextState) {
    nextState.favorites ||= {};nextState.blocks ||= [];nextState.reports ||= [];nextState.feedback ||= [];nextState.readState ||= {};nextState.schemaVersion=2;
    this.state = this.repository.reset(nextState);
    return this.getState();
  }

  commit(mutator) {
    const draft = structuredClone(this.state);
    expirePromotions(draft.ledger);
    const result = mutator(draft);
    expirePromotions(draft.ledger);
    validateState(draft);
    draft.updatedAt = new Date().toISOString();
    draft.revision = (this.state.revision || 0) + 1;
    this.repository.save(draft);
    this.state = draft;
    return structuredClone(result);
  }

  mustUser(id) { const found = this.state.users.find((item) => item.id === id); if (!found) throw new Error(`Usuario inexistente: ${id}`); return found; }

   }
   if(type==='review'){service.submitReview(data.exchangeId,{quality:data.quality?Number(data.quality):null,clarity:data.clarity?Number(data.clarity):null,communication:Number(data.communication),punctuality:Number(data.punctuality),wouldRepeat:data.wouldRepeat==='true',comment:data.comment});actionDone('Valoración guardada. Se respeta la privacidad bilateral.');return;}
   if(type==='report'){const r=service.createReport(data);actionDone(`Reporte ${r.id.toUpperCase()} guardado solo en esta demo.`);return;}
   if(type==='block'){const blocked=service.toggleBlock(data.subjectId);actionDone(blocked?'Perfil bloqueado en esta demo.':'Perfil desbloqueado.');return;}
   if(type==='no-show'){service.recordNoShow(data.exchangeId,data.role);actionDone('Escenario de ausencia aplicado. Revisá el ledger de CT.');return;}
   if(type==='resolve-dispute'){service.resolveDisputeDemo(data.exchangeId,Number(data.providerCt),data.reason);actionDone('Resolución de ejemplo registrada con un ajuste contable.');return;}
   if(type==='reset'){
     if(data.confirmText!=='RESTABLECER')throw new Error('Escribí RESTABLECER para confirmar.');
     service.reset(createSeedState());ui.stale=false;ui.drafts={};ui.compareIds=[];ui.compareByUser={};goto('/');toast('Datos de ejemplo restablecidos.');return;
   }
   if(type==='import-confirm'){
     if(!data.consent||!ui.importText)throw new Error('Confirmá el reemplazo de datos.');
     service.importData(ui.importText);ui.importText='';ui.drafts={};ui.compareIds=[];ui.compareByUser={};ui.stale=false;goto('/demo');toast('Respaldo recuperado.');return;
   }
   throw new Error('Formulario no disponible.');
 }catch(error){const area=form.querySelector('.form-error');if(area){area.textContent=error.message;motion.feedback('error',area);area.scrollIntoView({block:'nearest'});}else toast(error.message,true);}
});
function updatePublishPreview(){const form=document.querySelector('form[data-form="publish"]');const preview=document.getElementById('publish-preview');if(form&&preview)preview.innerHTML=publicationPreview(Object.fromEntries(new FormData(form)));}
function updateChatCounter(){const el=document.querySelector('[data-chat-counter]');if(el)el.textContent=String(document.getElementById('chat-text')?.value.length||0);}
function splitList(s=''){return String(s).split(',').map(v=>v.trim()).filter(Boolean).slice(0,3);}
let searchTimer;
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='chat-text')updateChatCounter();
 if(el.id==='command-query'){document.getElementById('command-results').innerHTML=commandResults(service.getState(),el.value);}
 if(el.id==='search'){ui.filters.query=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(refreshResults,160);}
 if(el.matches('[data-duration-input]'))updateDuration(el.closest('form'));
 if(el.closest('form[data-form="publish"]')){captureDraft();updatePublishPreview();}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.dataset.filter){ui.filters[el.dataset.filter]=el.type==='checkbox'?el.checked:el.value;refreshResults();}
 if(el.id==='publish-category'){ui.publishCategory=el.value;updatePublishModality(true);captureDraft();}
 if(el.matches('[data-duration-input]'))updateDuration(el.closest('form'));
 if(el.closest('form[data-form="publish"]')){captureDraft();updatePublishPreview();}
});
fileInput.addEventListener('change',async()=>{
 try{const file=fileInput.files?.[0];if(!file)return;if(file.size>2_000_000)throw new Error('El respaldo supera el máximo de 2 MB.');const text=await file.text();const preview=parseBackup(text);ui.importText=text;openDialog('import-confirm',{preview});}
 catch(error){ui.importText='';toast(error.message,true);}
});
function routeChanged(){
 if(dialog.open)closeDialog();
 const route=current();
 if(route.path==='/publicar'){if(route.params.type)ui.publishType=route.params.type==='need'?'need':'offer';if(getCategory(route.params.category))ui.publishCategory=route.params.category;}
 if(route.path.startsWith('/intercambios/')){
   const id=route.path.split('/')[2];const x=service.getState().exchanges.find(e=>e.id===id);
   if(x&&[x.providerId,x.requesterId].includes(service.getActiveUser().id)&&!ui.stale)service.markRead(id);
 }
 render({focus:true,transition:true});window.scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('keydown',event=>{
 const editable=event.target.matches('input,textarea,select,[contenteditable="true"]');
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'||event.key==='/'&&!editable&&!dialog.open){event.preventDefault();openDialog('command');return;}
 if(ui.dialog?.kind!=='command'||!dialog.open)return;
 const items=[...dialog.querySelectorAll('.command-result')];const input=document.getElementById('command-query');
 if(['ArrowDown','ArrowUp'].includes(event.key)&&items.length){event.preventDefault();const i=items.indexOf(document.activeElement);const n=event.key==='ArrowDown'?(i+1)%items.length:(i<0?items.length-1:(i-1+items.length)%items.length);items[n].focus();}
 if(event.key==='Enter'&&event.target===input&&items.length){event.preventDefault();items[0].click();}
});
window.addEventListener('hashchange',routeChanged);
window.addEventListener('storage',event=>{if(event.key===repository.key){ui.stale=true;if(!dialog.open)render();toast('Otra pestaña cambió los datos. Recargá el estado antes de seguir.',true);}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();ui.installPrompt=event;});
// Read-only inspection endpoint for QA of this explicitly local demo.
window.INTERA_DEMO=Object.freeze({version:'4.0',snapshot:()=>service.getState(),storageStatus:()=>({...repository.status,rawBackup:undefined})});
try{service.processDue();}catch(error){toast('No se pudo procesar un vencimiento: '+error.message,true);}
routeChanged();
setInterval(()=>{
 if(ui.stale)return;
 try{const count=service.processDue();if(count&&!dialog.open&&!document.activeElement?.matches('input,textarea,select')){render();toast('Se actualizaron los vencimientos de CT de esta demo.');}}catch{/* Domain validation keeps the previous state; manual retry is available. */}
},60000);
if(location.protocol==='http:'||location.protocol==='https:'){
 const manifest=document.createElement('link');manifest.rel='manifest';manifest.href='./manifest.webmanifest';document.head.append(manifest);
 if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{ /* Portable use does not depend on PWA installation. */ });
}

return Object.freeze({});
})();
})();
</script>
</body>
</html>
